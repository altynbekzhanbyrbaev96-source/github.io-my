<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Обеспечиваем корректное масштабирование на мобильных устройствах -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Минималистичное изображение</title>
    <!-- Подключаем Tailwind CSS для быстрой и чистой адаптивной верстки -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-950 m-0 p-4 sm:p-8 min-h-screen w-full flex items-center justify-center overflow-hidden">

    <!-- Контейнер для изображения, обеспечивающий центрирование и адаптивность -->
    <main class="w-full h-full flex items-center justify-center">
        <!-- 
            Отображается загруженное изображение images.jpg:
            - max-w-full и max-h-[90vh] гарантируют, что фото не выйдет за пределы экрана
            - object-contain сохраняет исходные пропорции
            - onerror обеспечивает резервную заглушку, если локальный файл не найден рядом с index.html
        -->
        <img 
            src="images.jpg" 
            alt="Изображение" 
            onerror="this.onerror=null; this.src='https://placehold.co/600x900/171717/525252?text=images.jpg';"
            class="max-w-full max-h-[90vh] w-auto h-auto object-contain"
        >
    </main>

</body>
</html>
